<!DOCTYPE html>
<html lang="vi">

<!-- ==================== HEAD ==================== -->
<head>
    <title>Sửa nhân viên — Admin</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<!-- ==================== END HEAD ==================== -->

<body class="admin-body">

<!-- ==================== SIDEBAR ==================== -->
<div class="admin-sidebar-overlay" id="adminSidebarOverlay"></div>

<button type="button" class="admin-sidebar-toggle" id="adminSidebarToggle" aria-label="Mở menu">
    <i class="bx bx-menu"></i>
</button>

<aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-sidebar-brand">
        <a href="index.html">
            <span class="logo-mark">MC</span>
            <span>MCuong Hotel<small>Bảng quản trị</small></span>
        </a>
    </div>

    <nav class="admin-nav">
        <div class="admin-nav-label">Tổng quan</div>
        <a href="#" class="admin-nav-link disabled"><i class="bx bx-grid-alt"></i> Dashboard</a>

        <div class="admin-nav-label">Quản lý</div>
        <a href="index.html" class="admin-nav-link active"><i class="bx bx-group"></i> Nhân viên</a>
        <a href="#" class="admin-nav-link disabled"><i class="bx bx-user"></i> Khách hàng</a>
        <a href="#" class="admin-nav-link disabled"><i class="bx bx-bed"></i> Phòng</a>
        <a href="#" class="admin-nav-link disabled"><i class="bx bx-calendar-check"></i> Đặt phòng</a>

        <div class="admin-nav-label">Khác</div>
        <a href="../" class="admin-nav-link"><i class="bx bx-home-alt"></i> Về trang chủ</a>
    </nav>

    <div class="admin-sidebar-user">
        <img src="https://images.pexels.com/photos/2379004/pexels-photo-2379004.jpeg?auto=compress&cs=tinysrgb&w=80" alt="Admin">
        <div class="admin-sidebar-user-info">
            <span class="admin-sidebar-user-name">Admin</span>
            <span class="admin-sidebar-user-role">Quản trị viên</span>
        </div>
        <a href="#" class="admin-sidebar-user-action" title="Cài đặt"><i class="bx bx-cog"></i></a>
    </div>

    <div class="admin-sidebar-footer">© 2026 MCuong Hotel</div>
</aside>
<!-- ==================== END SIDEBAR ==================== -->

<!-- ==================== NỘI DUNG (bên phải) ==================== -->
<div class="admin-wrapper">

    <main class="admin-content">

        <p class="admin-breadcrumb mb-3">
            <a href="index.html">Admin</a> / <a href="index.html">Nhân viên</a> / Sửa #1
        </p>

        <div class="admin-page-head">
            <div>
                <h2>Sửa nhân viên</h2>
                <p>Mã nhân viên: <strong>#1</strong></p>
            </div>
            <div class="d-flex gap-2">
                <a href="show.html" class="btn btn-outline-secondary">Xem chi tiết</a>
                <a href="index.html" class="btn btn-outline-secondary"><i class="bx bx-arrow-back me-1"></i>Danh sách</a>
            </div>
        </div>

        <form class="settings-section" action="show.html" method="get" enctype="multipart/form-data">
            <input type="hidden" name="id" value="1">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold text-muted">ID</label>
                    <input type="text" class="form-control" value="1" readonly disabled>
                </div>
                <div class="col-md-8">
                    <label class="form-label small fw-semibold" for="user_id">Tài khoản (user_id)</label>
                    <select class="form-select" id="user_id" name="user_id">
                        <option value="">— Chưa liên kết —</option>
                        <option value="12" selected>User #12</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold" for="full_name">Họ và tên <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="full_name" name="full_name" required maxlength="100" value="Nguyễn Văn An">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold" for="phone">Số điện thoại</label>
                    <input type="tel" class="form-control" id="phone" name="phone" maxlength="20" value="0901234567">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold" for="cccd">CCCD</label>
                    <input type="text" class="form-control" id="cccd" name="cccd" maxlength="20" value="001234567890">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold" for="birthday">Ngày sinh</label>
                    <input type="date" class="form-control" id="birthday" name="birthday" value="1995-08-20">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold" for="gender">Giới tính</label>
                    <select class="form-select" id="gender" name="gender">
                        <option value="">— Chọn —</option>
                        <option value="male" selected>Nam</option>
                        <option value="female">Nữ</option>
                        <option value="other">Khác</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold" for="hire_date">Ngày vào làm</label>
                    <input type="date" class="form-control" id="hire_date" name="hire_date" value="2022-03-15">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold" for="work_status">Trạng thái làm việc</label>
                    <select class="form-select" id="work_status" name="work_status">
                        <option value="working" selected>Đang làm việc</option>
                        <option value="temporary_leave">Nghỉ tạm</option>
                        <option value="resigned">Đã nghỉ</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label small fw-semibold" for="address">Địa chỉ</label>
                    <textarea class="form-control" id="address" name="address" rows="2">123 Nguyễn Huệ, Quận 1, TP.HCM</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold" for="position">Chức vụ</label>
                    <input type="text" class="form-control" id="position" name="position" maxlength="100" value="Lễ tân">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold" for="salary">Lương</label>
                    <input type="number" class="form-control" id="salary" name="salary" min="0" step="1000" value="12500000">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold" for="avatar">Đổi ảnh đại diện</label>
                    <input type="file" class="form-control" id="avatar" name="avatar" accept="image/*">
                </div>
                <div class="col-md-6 d-flex align-items-end">
                    <img id="avatarPreview" src="https://images.pexels.com/photos/2379004/pexels-photo-2379004.jpeg?auto=compress&cs=tinysrgb&w=200" alt="" class="avatar-lg" style="width:64px;height:64px">
                </div>
            </div>
            <hr class="my-4">
            <div class="d-flex gap-2 justify-content-end">
                <a href="index.html" class="btn btn-outline-secondary">Hủy</a>
                <button type="submit" class="btn btn-gold"><i class="bx bx-save me-1"></i>Cập nhật</button>
            </div>
        </form>

    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="admin-footer">
        <span>MCuong Hotel Admin — HTML tĩnh</span>
        <span>Phiên bản demo 1.0</span>
    </footer>
    <!-- ==================== END FOOTER ==================== -->

</div>
<!-- ==================== END NỘI DUNG ==================== -->

<!-- ==================== SCRIPTS ==================== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
    document.getElementById('avatar').addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;
        document.getElementById('avatarPreview').src = URL.createObjectURL(file);
    });
</script>
<!-- ==================== END SCRIPTS ==================== -->

</body>
</html>
